name: Build Nightwave Android

on:
  push:
    branches: [ Android ]
  pull_request:
    branches: [ Android ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: Android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27d
          add-to-path: true

      - name: Build with ndk-build
        run: |
          ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./Android.mk \
            NDK_APPLICATION_MK=./Application.mk \
            APP_ABI=arm64-v8a \
            APP_OPTIM=release \
            -j$(nproc)

      - name: Upload libnightwave.so
        uses: actions/upload-artifact@v4
        with:
          name: libnightwave
          path: libs/arm64-v8a/libnightwave.so
